<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
        />
        <link rel="stylesheet" href="/src/css/estilo.css" />
        <title>Tela de Cadastro</title>
    </head>

    <!-- Adicionada classe para aplicar estilos específicos a esta página -->
    <body class="pagina-registrar">
        <section>
            <div class="caixa-do-formulario">
                <div class="valor-do-formulario">
                    <form action="">
                        <h2>Registrar</h2>

                        <div class="caixa-de-entrada">
                            <input
                                type="email"
                                required
                                id="email"
                                class="input"
                                placeholder=" "
                            />
                            <i class="bi bi-envelope"></i>
                            <label class="input-label" for="email">Email</label>
                        </div>

                        <div class="caixa-de-entrada">
                            <input
                                type="password"
                                required
                                id="senha"
                                class="input"
                                placeholder=" "
                            />
                            <i class="bi bi-lock" id="btn-senha"></i>
                            <label class="input-label" for="senha">Senha</label>
                        </div>

                        <div class="caixa-de-entrada">
                            <input
                                type="password"
                                required
                                id="confirmar-senha"
                                class="input"
                                placeholder=" "
                            />
                            <i class="bi bi-lock" id="btn-confirmar-senha"></i>
                            <label class="input-label" for="confirmar-senha"
                                >Confirmar Senha</label
                            >
                        </div>

                        <button onclick="registrar(); return false">
                            Registrar
                        </button>

                        <div class="registrar">
                            <p>
                                Já possui uma conta?
                                <a href="index.html">Entrar</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <script src="src/js/registrar.js"></script>
    </body>
</html>
