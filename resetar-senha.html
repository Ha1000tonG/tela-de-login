<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
        />
        <link rel="stylesheet" href="/src/css/estilo.css" />
        <title>Redefinir Senha</title>
    </head>

    <body>
        <section>
            <div class="caixa-do-formulario">
                <div class="valor-do-formulario">
                    <form action="">
                        <h2>Crie sua Nova Senha</h2>

                        <div class="caixa-de-entrada">
                            <input
                                type="password"
                                required
                                id="nova-senha"
                                class="input"
                                placeholder=" "
                            />
                            <i class="bi bi-lock" id="btn-nova-senha"></i>
                            <label class="input-label" for="nova-senha"
                                >Nova Senha</label
                            >
                        </div>

                        <div class="caixa-de-entrada">
                            <input
                                type="password"
                                required
                                id="confirmar-nova-senha"
                                class="input"
                                placeholder=" "
                            />
                            <i
                                class="bi bi-lock"
                                id="btn-confirmar-nova-senha"
                            ></i>
                            <label
                                class="input-label"
                                for="confirmar-nova-senha"
                                >Confirmar Nova Senha</label
                            >
                        </div>

                        <button onclick="redefinirSenha(); return false">
                            Salvar Nova Senha
                        </button>

                        <div class="registrar">
                            <p>
                                <a href="index.html">Voltar para o Login</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <script type="module" src="src/js/resetar-senha.js"></script>
    </body>
</html>
