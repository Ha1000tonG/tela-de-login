<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
        />
        <link rel="stylesheet" href="/src/css/estilo.css" />
        <title>Recuperar Senha</title>
    </head>

    <!-- Adicionada classe para aplicar estilos específicos a esta página -->
    <body class="pagina-esqueci-senha">
        <section>
            <div class="caixa-do-formulario">
                <div class="valor-do-formulario">
                    <form action="">
                        <h2>Recuperar Senha</h2>
                        <p class="info-texto">
                            Digite seu e-mail cadastrado e enviaremos um link
                            para você redefinir sua senha.
                        </p>

                        <div class="caixa-de-entrada">
                            <input
                                type="email"
                                required
                                id="email"
                                class="input"
                                placeholder=" "
                            />
                            <i class="bi bi-envelope"></i>
                            <label class="input-label" for="email">Email</label>
                        </div>

                        <button onclick="solicitarReset(); return false">
                            Enviar Link de Recuperação
                        </button>

                        <div class="registrar">
                            <p>
                                Lembrou a senha?
                                <a href="index.html">Voltar para o Login</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <script src="src/js/esqueci-senha.js"></script>
    </body>
</html>
